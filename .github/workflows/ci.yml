name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Protocol unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run tests
        run: pio test -e native

  firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -e tdisplay
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-tdisplay
          path: |
            .pio/build/tdisplay/firmware.bin
            .pio/build/tdisplay/bootloader.bin
            .pio/build/tdisplay/partitions.bin

  simulate:
    name: PC simulator demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Build and run the simulator
        run: python3 tools/run_sim.py --out sim_out
      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: simulator-demo
          path: |
            sim_out/demo.gif
            sim_out/*.png
