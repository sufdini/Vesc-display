; VESC Display - PlatformIO project configuration
;
;   pio run -e tdisplay            build firmware for LilyGO TTGO T-Display
;   pio run -e tdisplay -t upload  flash it over USB
;   pio device monitor             watch the serial log (115200 baud)
;   pio test -e native             run the protocol unit tests on the host
;   pio run -e sim                 build the PC simulator (see tools/run_sim.py)

[platformio]
default_envs = tdisplay

[env]
build_flags = -Wall -Wextra

; ---------------------------------------------------------------------------
; LilyGO TTGO T-Display: ESP32 + 1.14" ST7789 135x240 TFT + two buttons
; ---------------------------------------------------------------------------
[env:tdisplay]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<sim/>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    ; --- TFT_eSPI setup for the T-Display (replaces User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

; ---------------------------------------------------------------------------
; PC simulator: the real firmware running against Arduino/TFT_eSPI stand-ins
; in src/sim. Produces .pio/build/sim/program; tools/run_sim.py drives it.
; ---------------------------------------------------------------------------
[env:sim]
platform = native
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -std=c++17
    -O2
    -I src/sim
    -I include

; ---------------------------------------------------------------------------
; Host build used only for unit tests of the protocol library
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
    -DVESC_NATIVE_TEST
test_framework = unity
